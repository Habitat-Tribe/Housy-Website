<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Housy — Build it. Renovate it. Design it. | Managed Home Projects</title>
    <meta name="description" content="Urban Company for whole home projects. Managed construction, renovation, and interior design for homeowners who can't be on site. Guaranteed fixed price, photo-proof milestone escrow, and verified crews." />
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#F0FDFA',
                100: '#CCFBF1',
                200: '#99F6E4',
                300: '#5EEAD4',
                400: '#2DD4BF',
                500: '#14B8A6',
                600: '#0D9488',
                700: '#0F766E',
                800: '#115E59',
                900: '#134E4A',
                950: '#042F2E',
              },
              amber: {
                50: '#FFFBEB',
                100: '#FEF3C7',
                200: '#FDE68A',
                500: '#F59E0B',
                600: '#D97706',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', system-ui, -apple-system, sans-serif],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      /* Custom high-contrast slider thumb */
      input[type=range]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
        background: #0D9488;
        border: 3px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        cursor: pointer;
      }
      input[type=range]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        background: #0D9488;
        border: 3px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
